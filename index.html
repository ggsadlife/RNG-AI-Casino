<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#11162c" />
    <meta name="description" content="A lightweight, offline AI Live Casino lobby demo." />
    <title>AI Live Casino Lite</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="world" aria-hidden="true"></div>
    <div class="shell" id="shell">
      <header class="topbar">
        <button class="brand" id="homeButton" type="button" data-action="home" aria-label="AI Live Casino Lite">
          <img src="assets/logo.svg" alt="" />
        </button>
        <div class="wallet" aria-label="Demo balance">
          <span class="demo-chip">DEMO</span>
          <span id="balanceText">5,380,461</span>
          <span class="pts">PTS</span>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh demo balance" title="Refresh demo balance">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 1M4 17l2 1a7 7 0 0 0 12.4-3"/></svg>
        </button>
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menuPanel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
        <button class="avatar-button" id="profileButton" type="button" aria-label="Open profile">
          <img src="assets/avatar.webp" alt="" />
        </button>
        <div class="menu-panel" id="menuPanel" hidden>
          <button type="button" data-action="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg><span data-i18n="lobby">Lobby</span></button>
          <button type="button" data-action="language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-i18n="language">Language</span></button>
          <button type="button" data-action="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3.2 3.8-4.8 7-4.8S17.6 15.8 19 19"/></svg><span data-i18n="profile">Profile</span></button>
          <button type="button" data-action="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 8v.01"/></svg><span data-i18n="about">About demo</span></button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
    <dialog id="modal" class="modal" aria-labelledby="modalTitle">
      <div id="modalContent"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
